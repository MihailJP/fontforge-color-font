[metadata]
name = fontforge_color_font
version = 0.0.0
author = MihailJP
author_email = mihailjp@gmail.com
description = FontForge_plugin for color fonts
license = MIT
license_files =
    LICENSE
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/MihailJP/fontforge-color-font
classifiers =
    Development Status :: 2 - Pre-Alpha
    Environment :: Plugins
    Intended Audience :: Developers
    Programming Language :: Python :: 3
    Operating System :: OS Independent
    Topic :: Text Processing :: Fonts

[options]
packages = fontforge_color_font
python_requires = >=3.8

[options.entry_points]
fontforge_plugin =
    Color Font = fontforge_color_font.__main__
